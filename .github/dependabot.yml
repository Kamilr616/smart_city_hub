version: 2
updates:
  - package-ecosystem: npm
    directory: /source/server/api
    schedule: { interval: weekly }
    target-branch: develop
    groups:
      non-major: { update-types: [minor, patch] }
  - package-ecosystem: npm
    directory: /source/web/react
    schedule: { interval: weekly }
    target-branch: develop
    groups:
      non-major: { update-types: [minor, patch] }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    target-branch: develop
