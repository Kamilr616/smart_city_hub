name: iOS migration validation
on:
  pull_request:
    branches: [develop]
permissions:
  contents: read
jobs:
  ios:
    runs-on: macos-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: source/mobile/react-native
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.22.3
      - name: Install emulator CLI in isolated directory
        run: |
          echo "FIREBASE_NODE=$(command -v node)" >> "$GITHUB_ENV"
          npm install --prefix "$RUNNER_TEMP/firebase-cli" firebase-tools@15.36.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 26.13.1
      - uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          ruby-version: '3.3'
          working-directory: source/mobile/react-native
      - run: npm ci
      - run: bundle install
      - run: bundle exec pod install
        working-directory: source/mobile/react-native/ios
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: ios-lockfiles
          path: |
            source/mobile/react-native/Gemfile.lock
            source/mobile/react-native/ios/Podfile.lock
          if-no-files-found: error
      - run: bundle exec pod install --deployment
        working-directory: source/mobile/react-native/ios
      - run: xcodebuild -list -workspace ios/expennsesapp.xcworkspace
      - run: xcodebuild -showdestinations -workspace ios/expennsesapp.xcworkspace -scheme expennsesapp
      - name: Build and test simulator
        timeout-minutes: 40
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for k,v in d["devices"].items() if "iOS" in k for x in v if x["name"].startswith("iPhone")))')
          xcodebuild test -configuration Release -workspace ios/expennsesapp.xcworkspace -scheme expennsesapp -destination "platform=iOS Simulator,id=$DEVICE_ID" CODE_SIGNING_ALLOWED=NO
      - name: Test authenticated simulator flows
        timeout-minutes: 40
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for k,v in d["devices"].items() if "iOS" in k for x in v if x["name"].startswith("iPhone")))')
          SCH_E2E_FIREBASE=1 "$FIREBASE_NODE" "$RUNNER_TEMP/firebase-cli/node_modules/firebase-tools/lib/bin/firebase.js" emulators:exec --config firebase.emulator.json --project demo-smart-city-hub --only auth "xcodebuild test -configuration Release -workspace ios/expennsesapp.xcworkspace -scheme expennsesappUITests -destination 'platform=iOS Simulator,id=$DEVICE_ID' -derivedDataPath '$RUNNER_TEMP/sch-ui-derived' CODE_SIGNING_ALLOWED=NO"
      - name: Audit Ruby dependencies
        if: always()
        run: bundle exec bundle-audit check --update
  firebase-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: source/mobile/react-native
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.22.3
      - name: Install emulator CLI in isolated directory
        run: |
          echo "FIREBASE_NODE=$(command -v node)" >> "$GITHUB_ENV"
          npm install --prefix "$RUNNER_TEMP/firebase-cli" firebase-tools@15.36.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 26.13.1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - name: Exercise Auth and Firestore emulators
        run: |
          "$FIREBASE_NODE" "$RUNNER_TEMP/firebase-cli/node_modules/firebase-tools/lib/bin/firebase.js" emulators:exec --config firebase.emulator.json --project demo-smart-city-hub --only auth,firestore "node scripts/firebase-emulator-smoke.js"
